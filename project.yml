name: NotaBene
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  NotaBene:
    path: .

targets:
  NotaBeneApp:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nota Bene
        NSCameraUsageDescription: Photograph highlighted passages so they can be sent to your chosen export targets.
        NSPhotoLibraryUsageDescription: Select an existing photo of a highlighted passage to send to your chosen export targets.
        UILaunchScreen: {}
        UIAppFonts:
          - Caveat-Regular.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.miguelvila.notabene.oauth
            CFBundleURLSchemes:
              - notabene
        NotionClientID: "36ed872b-594c-81a3-9e0d-0037dbd7ffdb"
        NotionWorkerBaseURL: "https://notabene-oauth.nota-bene-invariante.workers.dev"
        NotionAppRedirectScheme: notabene://oauth/notion/callback
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miguelvila.notabene
        DEVELOPMENT_TEAM: 99ABQRQY2V
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "5.9"
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Eval-capture (DEBUG-only) is gated inside the NotaBene Swift package via
    # `.define("EVAL_CAPTURE", .when(configuration: .debug))` in Package.swift,
    # not here — every `#if EVAL_CAPTURE` site lives in the package and Xcode
    # build settings don't reach into SwiftPM. See docs/eval-capture.md.
    dependencies:
      - package: NotaBene
        product: NotaBene

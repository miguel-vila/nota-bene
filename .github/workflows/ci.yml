name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Avoid stacking up redundant runs on rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (default + EVAL_CAPTURE)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: swift test (default flags)
        run: swift test

      - name: swift test (EVAL_CAPTURE + DEBUG)
        run: swift test -Xswiftc -DEVAL_CAPTURE -Xswiftc -DDEBUG

  eval-capture-release-guard:
    name: EVAL_CAPTURE absent from Release build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Regenerate Xcode project from project.yml
        run: xcodegen generate

      - name: Run release-config guard
        run: ./scripts/ci/check_no_eval_capture_in_release.sh

name: ReadwiseHighlighter
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  ReadwiseHighlighter:
    path: .

targets:
  ReadwiseHighlighter:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    info:
      path: App/Info.plist
      properties:
        NSCameraUsageDescription: Photograph highlighted passages so they can be sent to Readwise.
        NSPhotoLibraryUsageDescription: Select an existing photo of a highlighted passage to send to Readwise.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miguelvila.readwise.highlighter
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "5.9"
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: ReadwiseHighlighter
        product: ReadwiseHighlighter

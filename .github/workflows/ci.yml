name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Avoid stacking up redundant runs on rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (Debug + Release)
    runs-on: macos-26
    env:
      XCODE_VERSION: "26.6"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: Show Swift version
        run: swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-

      # Eval-capture is gated by `#if DEBUG` — on in Debug, off in Release.
      - name: swift test (Debug — #if DEBUG branches active)
        run: swift test

      - name: swift test (Release — #if DEBUG branches dropped)
        run: swift test -c release
